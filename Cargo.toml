[package]
name = "mihomo-traffic"
version = "0.2.6"
edition = "2024"
description = "A native Windows traffic ledger for Mihomo"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dirs = "6"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = "=0.3.1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
markdown = "1"
raw-window-handle = "0.6"
ntapi = "0.4.3"
psl = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "fallible_uint", "functions"] }
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
toml = "0.9"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
windows = { version = "=0.61.3", features = ["System", "Graphics_Effects", "UI_Composition_Desktop", "Win32_System_WinRT_Graphics_Direct2D", "Win32_System_WinRT_Composition", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
windows-numerics = "=0.2.0"
windows-core = "=0.61.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_Services", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
